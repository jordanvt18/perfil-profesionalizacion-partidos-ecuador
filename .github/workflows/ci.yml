name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perfil_user
          POSTGRES_PASSWORD: perfil_pass
          POSTGRES_DB: perfil_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perfil_user" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://perfil_user:perfil_pass@localhost:5432/perfil_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black isort

      - name: Lint
        run: |
          black --check src
          isort --check src

      - name: Run tests
        run: pytest

      - name: Build frontend
        run: |
          mkdir -p dist
          cp -r web/* dist/

      - name: Deploy frontend to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy API (placeholder)
        run: |
          echo "Implementar despliegue de la API en servicio externo (Railway, Render, Fly.io, etc.)"

  deploy-pages:
    needs: build-test-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
