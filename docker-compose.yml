version: "3.9"

services:
  api:
    build: .
    container_name: perfil-profesionalizacion-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: perfil-profesionalizacion-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-perfil_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-perfil_pass}
      - POSTGRES_DB=${POSTGRES_DB:-perfil_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
